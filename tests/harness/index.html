<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Apollo TAB-1 harness</title>
  <style>
    /* Home Assistant's own default colours, dark and light, so contrast
       checks see what people see. */
    :root {
      --primary-text-color: #e1e1e1;
      --secondary-text-color: #9b9b9b;
      --primary-background-color: #111111;
      --card-background-color: #1c1c1c;
      --divider-color: rgba(225, 225, 225, 0.12);
      --primary-color: #009ac7;
      --text-primary-color: #ffffff;
      --error-color: #db4437;
      font-family: system-ui, sans-serif;
    }
    :root.ha-light {
      --primary-text-color: #141414;
      --secondary-text-color: #5e5e5e;
      --primary-background-color: #fafafa;
      --card-background-color: #ffffff;
      --divider-color: rgba(0, 0, 0, 0.12);
      --primary-color: #009ac7;
      --text-primary-color: #ffffff;
      --error-color: #db4437;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--primary-background-color);
      color: var(--primary-text-color);
    }
    #app {
      min-height: 100vh;
      padding: 20px;
    }
    apollo-tab-panel {
      display: block;
      min-height: 100vh;
    }
    .cards-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 20px;
    }
    .sample {
      display: grid;
      gap: 8px;
    }
    .sample-label {
      font-size: 13px;
      color: var(--secondary-text-color);
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    import { createMockHass } from "./mock-hass.js";

    const query = new URLSearchParams(location.search);
    const view = query.get("view") || "cards";
    const seed = query.get("seed") || "sample";
    if (query.get("ha") === "light") {
      document.documentElement.classList.add("ha-light");
    }

    const getJson = (url) =>
      fetch(url).then((response) => {
        if (!response.ok) {
          throw new Error(`${url}: ${response.status}`);
        }
        return response.json();
      });

    const [fixtures, strings, realConfig] = await Promise.all([
      getJson("./fixtures.json"),
      getJson("../../custom_components/apollo_tab/library/strings.json"),
      seed === "real" ? getJson("./real-dashboard.json") : Promise.resolve(null),
    ]);
    fixtures.strings = strings;

    const mock = createMockHass(fixtures, {
      seed,
      realConfig,
      community: Boolean(query.get("community")),
      graphs: Boolean(query.get("graphs")),
      // "three", "no-engine", "new" or "all" stand-in tablets, and a second
      // dashboard, "Night".
      tablets: query.get("tablets") || "none",
      night: Boolean(query.get("night")),
    });
    window.hassConnection = Promise.resolve({ conn: mock.connection });
    window.__apolloFixtures = fixtures;
    window.__apolloMockHass = mock;

    await import("../../custom_components/apollo_tab/frontend/apollo-tab.js");

    const themeId = query.get("theme") || "midnight";
    const theme = fixtures.themes.find((entry) => entry.id === themeId) || fixtures.themes[0];
    const app = document.getElementById("app");

    function cardSample(fixture, title, eventOverride) {
      const wrap = document.createElement("section");
      wrap.className = "sample";

      const label = document.createElement("div");
      label.className = "sample-label";
      label.textContent = title || fixture.init.name || fixture.id;

      const card = document.createElement("apollo-tab-card");
      const width = fixture.init.w || 376;
      const height = fixture.init.h || 184;
      card.style.width = `${width}px`;
      card.style.height = `${height}px`;

      const config = {
        ...(fixture.card || {}),
        component: fixture.id,
        title: title || fixture.init.name || fixture.id,
      };
      if (eventOverride) {
        config.__scenario = eventOverride;
      }
      card.setConfig(config);
      card.hass = mock;
      wrap.append(label, card);
      return wrap;
    }

    function renderCards() {
      document.body.style.background = theme.wall;
      const grid = document.createElement("div");
      grid.className = "cards-grid";
      for (const fixture of fixtures.cards) {
        grid.append(cardSample(fixture));
      }
      app.append(grid);
    }

    function renderStates() {
      document.body.style.background = theme.wall;
      const grid = document.createElement("div");
      grid.className = "cards-grid";
      const light = fixtures.cards.find((entry) => entry.id.includes("light-tile")) || fixtures.cards[0];
      const slider = fixtures.cards.find((entry) => entry.id.includes("slider")) || fixtures.cards[0];

      grid.append(
        cardSample(light, "off", "off"),
        cardSample(light, "on", "on"),
        cardSample(slider, "zero", "zero"),
        cardSample(slider, "half", "half"),
        cardSample(slider, "full", "full"),
        cardSample(light, "subscription error", "error"),
        cardSample(light, "slot error", "slot-error"),
        cardSample(light, "example", "example"),
        cardSample(light, "missing entity", "missing"),
        cardSample(light, "custom colour", "custom-color"),
        cardSample(light, "vertical gradient", "vertical"),
        cardSample(light, "horizontal gradient", "horizontal"),
        cardSample(light, "transparency", "transparency"),
        cardSample(light, "custom accent", "accent"),
      );
      app.append(grid);
    }

    function renderPreview() {
      const preview = document.createElement("apollo-tab-preview");
      preview.hass = mock;
      preview.dashboard = fixtures.layout.url_path || "tab-1";
      app.append(preview);
    }

    // Home Assistant makes a new panel element each time the person comes
    // back to the panel through its sidebar; the scripted run does the same
    // with window.__apolloOpenPanel(path).
    function openPanel(path) {
      const panel = document.createElement("apollo-tab-panel");
      panel.narrow = window.innerWidth < 870;
      panel.route = { prefix: "/apollo-tab", path };
      panel.panel = {};
      panel.hass = mock;
      window.__apolloPanel?.remove();
      document.body.append(panel);
      window.__apolloPanel = panel;
      return panel;
    }

    function renderPanel() {
      app.remove();
      openPanel(query.get("route") || "");
      window.__apolloOpenPanel = openPanel;
      window.addEventListener("resize", () => {
        window.__apolloPanel.narrow = window.innerWidth < 870;
      });
    }

    if (view === "cards") {
      renderCards();
    } else if (view === "states") {
      renderStates();
    } else if (view === "preview") {
      renderPreview();
    } else if (view === "panel") {
      renderPanel();
    }
  </script>
</body>
</html>
