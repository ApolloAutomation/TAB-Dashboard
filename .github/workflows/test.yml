name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: pip install --require-hashes -r requirements_test.txt
      # The tablet link test with ESPHome's real RuntimeEntryData needs what
      # Home Assistant's esphome and usb integrations need, including what
      # the integrations they import and depend on need (assist_satellite
      # brings hassil, for one). They are not in the test requirements, so
      # install the versions the installed Home Assistant pins, without
      # changing anything already installed. The beta job does the same.
      - name: Install what the ESPHome integration needs
        run: |
          pip freeze > "$RUNNER_TEMP/installed.txt"
          python .github/scripts/esphome_requirements.py > "$RUNNER_TEMP/esphome.txt"
          cat "$RUNNER_TEMP/esphome.txt"
          pip install -c "$RUNNER_TEMP/installed.txt" -r "$RUNNER_TEMP/esphome.txt"
      - name: Everything is there, with the aioesphomeapi Home Assistant pins
        run: python .github/scripts/esphome_requirements.py --check
      - run: pip show homeassistant aioesphomeapi
      - name: The ESPHome internals the link uses import
        run: python -c "from homeassistant.components.esphome.entry_data import RuntimeEntryData"
      - run: ruff check .
      - run: ruff format --check .
      # With APOLLO_TAB_NEED_ESPHOME set, the ESPHome link tests fail
      # instead of skipping when ESPHome cannot be imported.
      - run: pytest -rs
        env:
          APOLLO_TAB_NEED_ESPHOME: "1"
      - run: node --test "tests/frontend/*.test.mjs"
