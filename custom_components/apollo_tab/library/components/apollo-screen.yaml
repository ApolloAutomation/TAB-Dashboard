schema: 2
id: apollo/screen
version: 2.0.0
name: Screen brightness
description: Make the tablet's screen brighter or darker.
icon: mdi:tablet
group: home

params:
  entity: {domain: light, label: Screen light, help: The tablet's own Backlight}

inputs:
  pct:  "{{ ((state_attr(entity, 'brightness') or 0) / 2.55) | round | int }}"
  # While the screen light is gone: its state, not "0%".
  text: "{{ state_translated(entity) if states(entity) in ['unavailable', 'unknown'] else pct ~ '%' }}"

outputs:
  set: {action: light.turn_on, data: {entity_id: "{{ entity }}", brightness_pct: "{{ value }}"},
        feedback: optimistic}

state: text
lit: none

parts:
  bar: {type: slider, look: bar, value: pct, min: 10, max: 100, icon: "mdi:brightness-6",
        on_change: set}

variants:
  row:
    name: Row
    grid: [12, 2]
    header: chip
    layout: [{use: bar}]
  wide:
    name: Wide
    grid: [12, 3]
    header: tile
    # The bar takes the card's height: no empty band under the header.
    layout: [{use: bar, grow: true}]

preview:
  inputs: {pct: 80, text: "80%"}
