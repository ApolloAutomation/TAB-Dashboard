schema: 2
id: apollo/people
version: 2.0.0
name: People
description: Who is home, and where everyone else is.
icon: mdi:account-multiple
group: home
replaces: [community/presence-chips]

params:
  people: {domain: person, multiple: true, max: 8, label: People}

options:
  show_place: {type: toggle, section: shows, label: Where they are, default: true}

inputs:
  anyone_home: "{{ people | select('is_state', 'home') | list | count > 0 }}"

on: anyone_home
lit: none

parts:
  faces:  {type: image, for_each: people, as: p, per_row: 4, value: "{{ 'mdi:account' }}", look: badge,
           colour: "{{ 'good' if is_state(p, 'home') else 'muted' }}", when: [tablet.v2]}
  names:  {type: label, for_each: people, as: p, per_row: 4, size: s, align: centre,
           text: "{{ state_attr(p, 'friendly_name') or p }}", when: [tablet.v2]}
  places: {type: label, for_each: people, as: p, per_row: 4, size: s, align: centre,
           text: "{{ state_translated(p) }}", when: [show_place, tablet.v2]}
  lines:
    type: row
    for_each: people
    as: p
    height: 28
    when: [tablet.v2]
    items:
      - {type: image, value: "{{ 'mdi:account' }}", look: bare, width: 24,
         colour: "{{ 'good' if is_state(p, 'home') else 'muted' }}"}
      - {type: label, text: "{{ state_attr(p, 'friendly_name') or p }}", size: s}
      - {type: label, text: "{{ state_translated(p) }}", size: s, align: right, when: [show_place]}
  # What a tablet with older software shows on the tall card.
  old_lines: {type: label, for_each: people, as: p, size: s, when: ["!tablet.v2"],
              text: "{{ state_attr(p, 'friendly_name') or p }}: {{ state_translated(p) }}"}

variants:
  wide:
    name: Wide
    grid: [12, 3]
    header: none
    v1: community/presence-chips
    layout: [{use: faces}, {use: names}, {use: places}]
  tall:
    name: Tall
    grid: [6, 6]
    header: title
    layout: [{use: lines}, {use: old_lines}]

preview:
  params: {people: [person.anna, person.ben, person.cleo]}
  inputs: {anyone_home: true}
