schema: 2
id: apollo/button
version: 2.0.0
name: Button
description: Press a button, run a script or start a scene with a tap.
icon: mdi:power
group: home

params:
  entity: {domain: [button, input_button, script, scene], label: What it runs}

inputs:
  name: "{{ state_attr(entity, 'friendly_name') or entity }}"
  # Gone, or missing from Home Assistant: the card fades. A button's state
  # is "unknown" until it is first pressed, so that is not gone.
  gone: "{{ is_state(entity, 'unavailable') or expand(entity) | count == 0 }}"

outputs:
  press: {action: {button: button.press, input_button: input_button.press, script: script.turn_on,
                   scene: scene.turn_on},
          data: {entity_id: "{{ entity }}"}, feedback: pulse}

unavailable: gone
lit: none
tap:
  default: press
  choices:
    press: {label: Runs it, output: press}
    none:  {label: Does nothing}

parts:
  # What a tablet with older software shows: one button with the name.
  old_button: {type: button, text: "{{ name }}", on_tap: press, when: ["!tablet.v2"]}

variants:
  chip:
    name: Chip
    grid: [12, 1]
    header: chip
    v1: note
    layout:
      - {type: space}
  small:
    name: Small
    grid: [6, 2]
    # The badge, the name across the card under it, as on the other tiles
    # (LOOK-NOTES decision 14).
    header: tile
    layout:
      - {use: old_button}
  tile:
    name: Tile
    grid: [6, 3]
    # As Small; a large button takes the foot (LOOK-NOTES decision 14). In
    # a taller card it stops at 120, as the Switch Tile's does.
    header: tile
    layout:
      - {type: button, icon: "mdi:play", on_tap: press, big_icon: true, grow: true,
         most: 120, when: [tablet.v2]}
      - {use: old_button}

preview:
  params: {entity: script.example}
  inputs: {name: Good night, gone: false}
