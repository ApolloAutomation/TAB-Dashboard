schema: 2
id: apollo/number
version: 2.0.0
name: Number
description: Set a number with a bar or with minus and plus.
icon: mdi:gauge
group: more

params:
  entity: {domain: [number, input_number], label: Number}

options:
  control: {type: choice, section: controls, label: Control, default: bar,
            choices: {bar: Bar, buttons: Minus and plus}}

inputs:
  now:  "{{ states(entity) | float(none) }}"
  text: "{{ (states(entity) ~ ' ' ~ (state_attr(entity, 'unit_of_measurement') or '')) | trim }}"

outputs:
  set:  {action: {number: number.set_value, input_number: input_number.set_value},
         data: {entity_id: "{{ entity }}", value: "{{ value }}"}, feedback: optimistic}
  down: {action: {number: number.set_value, input_number: input_number.set_value}, uses: {now: number},
         data: {entity_id: "{{ entity }}", value: "{{ [now - can.step, can.min] | max }}"},
         feedback: optimistic}
  up:   {action: {number: number.set_value, input_number: input_number.set_value}, uses: {now: number},
         data: {entity_id: "{{ entity }}", value: "{{ [now + can.step, can.max] | min }}"},
         feedback: optimistic}

state: text
lit: none

parts:
  bar:     {type: slider, look: bar, value: now, min: "{{ can.min }}", max: "{{ can.max }}",
            step: "{{ can.step }}", on_change: set, when: ["control=bar"]}
  buttons: {type: row, when: ["control=buttons"], items: [
             {type: button, icon: "mdi:minus", text: Less, on_tap: down},
             {type: button, icon: "mdi:plus", text: More, on_tap: up}]}
  # What a tablet with older software shows under the bar.
  old_text: {type: label, text: "{{ text }}", size: s, when: ["!tablet.v2"]}

variants:
  row:
    name: Row
    grid: [12, 2]
    header: chip
    layout: [{use: bar}, {use: buttons}]
  wide:
    name: Wide
    grid: [12, 3]
    header: tile
    layout: [{use: bar}, {use: buttons}, {use: old_text}]

preview:
  params: {entity: number.example}
  can: {min: 0, max: 100, step: 1, unit: "%"}
  inputs: {now: 40, text: "40 %"}
