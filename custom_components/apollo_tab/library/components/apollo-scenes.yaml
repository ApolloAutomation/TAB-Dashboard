schema: 2
id: apollo/scenes
version: 2.0.0
name: Scenes
description: One button for each scene or script you pick.
icon: mdi:palette
group: home
replaces: [apollo/scene-row]
v1: apollo/scene-row

params:
  scenes: {domain: [scene, script], multiple: true, max: 8, label: Scenes}

options:
  show_names: {type: toggle, section: shows, label: Names under the icons, default: true}
  per_row:    {type: choice, section: look, label: Buttons in a row, default: "4",
               choices: {"2": Two, "4": Four}}

inputs:
  # Every scene gone or missing from Home Assistant: the card fades. A
  # scene that never ran is "unknown", which is not gone.
  gone: >-
    {{ scenes | select('is_state', 'unavailable') | list | count + (scenes | count - expand(scenes) | count) >= scenes | count }}

outputs:
  run: {action: {scene: scene.turn_on, script: script.turn_on}, data: {entity_id: "{{ s }}"},
        feedback: pulse}

unavailable: gone
lit: none

parts:
  named:  {type: button, for_each: scenes, as: s, icon: "{{ s_can.icon }}",
           text: "{{ state_attr(s, 'friendly_name') or s }}", on_tap: run, when: [show_names]}
  bare:   {type: button, for_each: scenes, as: s, icon: "{{ s_can.icon }}", on_tap: run,
           when: ["!show_names"]}
  # Names only: four to a row leave too little room for an icon beside them.
  words:  {type: button, for_each: scenes, as: s, text: "{{ state_attr(s, 'friendly_name') or s }}",
           on_tap: run, when: [show_names]}

variants:
  wide:
    name: Wide
    grid: [12, 3]
    # The title names the card; the buttons take the rest of its height.
    # Up to four scenes share two rows, so a name like "Movie Night" fits.
    header: title
    layout:
      - {use: words, per_row: 4, two_rows: true, grow: true, when: ["per_row=4"]}
      - {use: named, per_row: 2, grow: true, when: ["per_row=2"]}
      - {use: bare, per_row: 4, grow: true, when: ["per_row=4"]}
      - {use: bare, per_row: 2, grow: true, when: ["per_row=2"]}
  large:
    name: Large
    grid: [12, 6]
    header: title
    # The rows of buttons grow to 56 at most, as List rows do; a card with
    # few scenes keeps the rest as its foot (coordinator, L4).
    layout:
      - {use: named, per_row: 2, big_icon: true, grow: true, most: 56}
      - {use: bare, per_row: 2, big_icon: true, grow: true, most: 56}

preview:
  params: {scenes: [scene.movie, scene.dinner, scene.relax, scene.all_off]}
