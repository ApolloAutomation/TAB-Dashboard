schema: 2
id: apollo/room
version: 2.0.0
name: Room
description: A room at a glance, its warmth and its lights, with a tap to its page.
icon: mdi:sofa
group: home
replaces: [community/room-summary]

# The sensors are not named temperature and humidity: those are names of
# facts (can.temperature), which a device param may not take.
params:
  page:               {type: page, optional: true, label: Room page}
  temperature_sensor: {domain: sensor, optional: true, label: Temperature}
  humidity_sensor:    {domain: sensor, optional: true, label: Humidity}
  lights:             {domain: light, multiple: true, max: 16, optional: true, label: Lights}
  extra:              {domain: any, optional: true, label: One more reading}

options:
  show_count:       {type: toggle, section: shows, label: Lights on, default: true}
  show_temperature: {type: toggle, section: shows, label: Temperature, default: true}
  show_extra:       {type: toggle, section: shows, label: The extra reading, default: true}

inputs:
  temp: >-
    {{ (states(temperature_sensor) ~ (state_attr(temperature_sensor, 'unit_of_measurement') or '')) if temperature_sensor else '' }}
  humid:      "{{ (states(humidity_sensor) ~ '%') if humidity_sensor else '' }}"
  on_count:   "{{ lights | select('is_state', 'on') | list | count }}"
  any_on:     "{{ on_count > 0 }}"
  count:      "{{ on_count }} of {{ lights | count }} lights on"
  extra_line: >-
    {{ ((state_attr(extra, 'friendly_name') or extra) ~ ': ' ~ (states(extra) ~ ' ' ~ (state_attr(extra, 'unit_of_measurement') or '')) | trim) if extra else '' }}
  line:       "{{ [temp, humid] | select | join(' · ') }}"

outputs:
  lights_on:  {action: light.turn_on, data: {entity_id: "{{ lights }}"}, feedback: optimistic}
  lights_off: {action: light.turn_off, data: {entity_id: "{{ lights }}"}, feedback: optimistic}
  go:         {local: go_to_page, page: "{{ page }}"}

on: any_on
state: line
lit: icon
tap:
  default: go
  choices:
    go:   {label: Goes to the room's page, output: go}
    none: {label: Does nothing}

parts:
  temp:   {type: label, text: "{{ temp }}", size: l, when: [has.temperature_sensor, show_temperature]}
  count:  {type: label, text: "{{ count }}", size: s, when: [has.lights, show_count]}
  extra:  {type: label, text: "{{ extra_line }}", size: s, when: [has.extra, show_extra]}
  lights:
    type: swap
    when: [has.lights, tablet.v2]
    items:
      - {type: button, text: Lights off, icon: "mdi:lightbulb", on_tap: lights_off, visible: any_on}
      - {type: button, text: Lights on, icon: "mdi:lightbulb-on", on_tap: lights_on,
         visible: "{{ not any_on }}"}
  # What a tablet with older software shows: one line and a button to the page.
  old_line: {type: label, size: s, when: ["!tablet.v2"],
             text: "{{ [temp, humid, count if lights else ''] | select | join(' · ') }}"}
  old_go:   {type: button, text: View room, on_tap: go, when: ["!tablet.v2", has.page]}

variants:
  tile:
    name: Tile
    grid: [6, 3]
    header: tile
    layout: [{use: temp, when: [tablet.v2]}, {use: old_line}, {use: old_go}]
  room:
    name: Room
    grid: [9, 5]
    header: tile
    layout:
      - {use: count, when: [tablet.v2]}
      - {use: temp, size: xl, when: [tablet.v2]}
      - {use: extra, when: [tablet.v2]}
      - {use: lights}
      - {use: old_line}
      - {use: old_go}

preview:
  params: {page: home}
  inputs: {temp: "21.5°C", humid: "46%", on_count: 2, any_on: true, count: "2 of 4 lights on",
           extra_line: "", line: "21.5°C · 46%"}
